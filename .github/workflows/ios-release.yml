name: iOS App Store Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp service-worker.js www/
          cp manifest.json www/
          cp favicon.ico www/ 2>/dev/null || true
          cp favicon-32x32.png www/ 2>/dev/null || true
          cp -r static www/

      - name: Add iOS platform and sync web assets
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Install Codemagic CLI tools
        run: pip3 install codemagic-cli-tools --break-system-packages

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch signing files (creates if missing)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files com.gvtech.seshscore \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        run: keychain add-certificates

      - name: Set up code signing
        run: xcode-project use-profiles

      - name: Build IPA
        run: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --testflight
